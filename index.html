<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338ca" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/new-veritas-logo-new.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <!-- Noto Serif -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- SEO — sane defaults for the initial (pre-hydration) paint.
         Every route overrides title/description/canonical/og via the
         <Seo> component (react-helmet-async) once React mounts, so
         crawlers that execute JS (Googlebot) always see per-page values. -->
    <title>Veritas Organisation | Performance-Driven Sales Partner, Singapore</title>
    <meta name="description" content="Veritas connects households and businesses to trusted partners across energy, printing, cleaning, and business development — performance-driven, results-first." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — read by LinkedIn, Facebook, iMessage, Slack, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veritas Organisation" />
    <meta property="og:title" content="Veritas Organisation | Performance-Driven Sales Partner, Singapore" />
    <meta property="og:description" content="Performance-driven sales partner connecting households and businesses to trusted partners across energy, printing, cleaning, and business development." />
    <meta property="og:image" content="https://veritasorganisation.com/og-image.png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:url" content="https://veritasorganisation.com/" />
    <meta property="og:locale" content="en_SG" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Veritas Organisation | Performance-Driven Sales Partner, Singapore" />
    <meta name="twitter:description" content="Performance-driven sales partner connecting households and businesses to trusted partners across energy, printing, cleaning, and business development." />
    <meta name="twitter:image" content="https://veritasorganisation.com/og-image.png" />

    <link rel="canonical" href="https://veritasorganisation.com/" />

    <!-- Structured data — Organization / LocalBusiness (Singapore) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Veritas Organisation",
      "url": "https://veritasorganisation.com/",
      "logo": "https://veritasorganisation.com/new-veritas-logo-new.png",
      "description": "Performance-driven sales company specializing in growing service businesses across energy, utilities, telecommunications, and facilities management.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "7030 Ang Mo Kio Ave 5, #08-98",
        "addressLocality": "Singapore",
        "postalCode": "569880",
        "addressCountry": "SG"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+65-8203-7719",
        "contactType": "customer service",
        "email": "enquiry@veritasorganisation.com",
        "areaServed": "SG"
      },
      "sameAs": [
        "https://www.facebook.com/profile.php?id=61574382356043",
        "https://www.instagram.com/veritas.organisation2026/",
        "https://www.linkedin.com/company/veritas-organisation2026/"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
